version: 2

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - profiles.example.json

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Package managers. Both publish to repos owned by the same account, which the default
# GITHUB_TOKEN cannot write to, so the release workflow passes a PAT as
# HOMEBREW_TAP_GITHUB_TOKEN (contents: write on homebrew-tap and scoop-bucket).
homebrew_casks:
  - name: dbclone
    repository:
      owner: phuthuycoding
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://phuthuycoding.github.io/dbclone/
    description: Clone MongoDB and MySQL databases between any two connections through local Docker containers
    license: MIT
    binaries:
      - dbclone
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

scoops:
  - name: dbclone
    repository:
      owner: phuthuycoding
      name: scoop-bucket
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://phuthuycoding.github.io/dbclone/
    description: Clone MongoDB and MySQL databases between any two connections through local Docker containers
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
